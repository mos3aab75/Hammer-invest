
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Hammer Invest - Egyptian stock market, economy and banking analysis">
<title>Hammer Invest | الأسواق المالية</title>

<style>
:root {
  --bg:#0b1017;
  --panel:#141d28;
  --panel2:#1b2836;
  --text:#f4f7fa;
  --muted:#aab6c4;
  --green:#28d394;
  --red:#f05252;
  --gold:#f2c14e;
  --border:#2b3b4d;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
  line-height:1.7;
}
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  padding:16px 5%;
  background:#0e151e;
  border-bottom:1px solid var(--border);
}
.brand { font-size:25px; font-weight:900; }
.brand span { color:var(--green); }
.logo-space {
  width:90px;
  height:48px;
  border:1px dashed #526171;
  border-radius:8px;
}
button, input, select, textarea {
  font:inherit;
  border-radius:8px;
  padding:10px 12px;
}
button { cursor:pointer; }
.lang-btn,.primary {
  background:var(--green);
  color:#07140f;
  border:0;
  font-weight:bold;
}
main { width:min(1200px,92%); margin:25px auto; }
.hero { padding:12px 0 24px; }
h1 { font-size:clamp(28px,5vw,44px); line-height:1.3; }
h1 span,h2 span { color:var(--green); }
h2 { font-size:23px; margin-top:0; }
h3 { margin-top:0; }
.muted { color:var(--muted); }
.section { margin:30px 0; }
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:15px;
}
.card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  min-width:0;
}
.tag {
  display:inline-block;
  padding:3px 10px;
  border-radius:20px;
  background:#15372c;
  color:var(--green);
  font-size:12px;
}
.field {
  width:100%;
  display:block;
  margin:8px 0 12px;
  color:var(--text);
  background:#0b121a;
  border:1px solid var(--border);
}
.result {
  margin-top:12px;
  padding:12px;
  border-radius:9px;
  background:#0b121a;
  color:var(--muted);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.primary { width:100%; }
.chart {
  width:100%;
  height:480px;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel);
}
.chart iframe { width:100%; height:100%; border:0; }
.links {
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}
.links a {
  display:block;
  padding:12px 15px;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:9px;
  color:var(--green);
  text-decoration:none;
}
.notice {
  border-right:3px solid var(--gold);
  padding:10px 14px;
  background:#201e18;
  color:#f4d78d;
  font-size:13px;
}
footer {
  border-top:1px solid var(--border);
  text-align:center;
  padding:25px 5%;
  color:var(--muted);
}
@media(max-width:600px) {
  header { padding:14px 4%; }
  .brand { font-size:21px; }
  .chart { height:390px; }
}
</style>
</head>
